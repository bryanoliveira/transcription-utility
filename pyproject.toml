[project]
name = "transcription-utility"
version = "0.1.0"
description = "Multi-model audio transcription CLI and Python package"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "ffmpeg-python>=0.2",
]

[project.optional-dependencies]
qwen = [
    "qwen-asr[vllm]>=0.0.6",
    "setuptools<=80.10.2",
    "vllm[audio]>=0.14.0",
]
whisper = [
    "openai-whisper>=20231117",
]
omnilingual = [
    "omnilingual-asr>=0.1",
]
all = [
    "transcription-utility[qwen,whisper,omnilingual]",
]

[project.scripts]
transcribe = "transcription_utility.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
cache-dir = "/tmp/uv-cache-vision"

[tool.hatch.build.targets.wheel]
packages = ["transcription_utility"]
