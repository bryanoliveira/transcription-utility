[project]
name = "transcription-utility"
version = "0.3.0"
description = "Audio transcription: CLI, batch jobs, and an OpenAI-compatible API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]
qwen = [
    "qwen-asr[vllm]>=0.0.6",
    "setuptools<=80.10.2",
    "vllm[audio]>=0.14.0",
]
whisper = [
    "openai-whisper>=20231117",
]
omnilingual = [
    "omnilingual-asr>=0.1",
]
all = [
    "transcription-utility[server,qwen,whisper,omnilingual]",
]

[project.scripts]
transcribe = "transcription_utility.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
cache-dir = "/tmp/uv-cache-vision"

[tool.hatch.build.targets.wheel]
packages = ["transcription_utility"]
